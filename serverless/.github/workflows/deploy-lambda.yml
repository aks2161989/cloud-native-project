name: Deploy Serverless Lambda

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-lambda:
    name: Build & Deploy Lambda Function
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm ci --production

      - name: Package Lambda Zip
        run: |
          zip -r function.zip index.js node_modules package.json

      - name: Configure AWS Credentials (Dev)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV || secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV || secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Update Lambda Code in DEV
        run: |
          FUNCTION_NAME="${{ vars.LAMBDA_FUNCTION_NAME || secrets.LAMBDA_FUNCTION_NAME || 'dev-vpc-user-verification-lambda' }}"
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://function.zip

      - name: Configure AWS Credentials (Demo)
        if: ${{ secrets.AWS_ACCESS_KEY_ID_DEMO != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEMO }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEMO }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Update Lambda Code in DEMO
        if: ${{ secrets.AWS_ACCESS_KEY_ID_DEMO != '' }}
        run: |
          FUNCTION_NAME="${{ vars.LAMBDA_FUNCTION_NAME_DEMO || secrets.LAMBDA_FUNCTION_NAME_DEMO || 'demo-vpc-user-verification-lambda' }}"
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://function.zip
