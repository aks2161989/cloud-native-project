spring.application.name=productcatalog-api

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/productcatalog_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345678}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Error Handling
spring.web.error.include-stacktrace=never

# S3 Configuration
aws.s3.bucket.name=${S3_BUCKET_NAME:}
aws.region=${AWS_REGION:us-east-1}

# Multipart Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Bean Overriding
spring.main.allow-bean-definition-overriding=true

# Application Logging Configuration
logging.file.name=${LOG_FILE_PATH:/var/log/csye6225/app.log}
logging.level.root=INFO
logging.level.com.akshay.productcatalog=INFO
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# StatsD Custom Metrics Configuration
management.statsd.metrics.export.host=${STATSD_HOST:localhost}
management.statsd.metrics.export.port=${STATSD_PORT:8125}
management.statsd.metrics.export.prefix=${STATSD_PREFIX:csye6225}
management.statsd.metrics.export.enabled=${STATSD_ENABLED:true}
