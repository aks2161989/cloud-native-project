name: Build Packer AMI & Deploy to Demo

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: productcatalog_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d productcatalog_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run unit & integration tests and build application artifact
        run: mvn clean verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/productcatalog_db
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3

      - name: Packer init
        run: packer init .

      - name: Validate Packer template
        run: packer validate .

      - name: Configure AWS credentials for DEV account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV || secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV || secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Build AMI in DEV AWS account
        id: packer-build
        run: |
          packer build -color=false .
          AMI_ID=$(jq -r '.builds[-1].artifact_id' manifest.json | cut -d ":" -f2)
          echo "Built AMI ID: $AMI_ID"
          if [ -z "$AMI_ID" ] || [ "$AMI_ID" == "null" ]; then
            echo "Error: Could not extract AMI ID from manifest.json"
            exit 1
          fi
          echo "AMI_ID=$AMI_ID" >> $GITHUB_ENV

      - name: Reconfigure GitHub Runner AWS CLI for DEMO account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEMO }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEMO }}
          aws-region: us-east-1

      - name: Create new Launch Template version
        id: update-lt
        run: |
          echo "Creating new Launch Template version with AMI ID: $AMI_ID"
          LAUNCH_TEMPLATE_NAME="csye6225_asg"
          NEW_VERSION=$(aws ec2 create-launch-template-version \
            --launch-template-name "$LAUNCH_TEMPLATE_NAME" \
            --source-version '$Latest' \
            --launch-template-data '{"ImageId":"'"$AMI_ID"'"}' \
            --query 'LaunchTemplateVersion.VersionNumber' \
            --output text)
          echo "Created Launch Template Version: $NEW_VERSION"

      - name: Trigger Instance Refresh on Auto Scaling Group
        id: instance-refresh
        run: |
          # Discover or get ASG name
          ASG_NAME="${{ vars.AUTO_SCALING_GROUP_NAME || secrets.AUTO_SCALING_GROUP_NAME }}"
          if [ -z "$ASG_NAME" ]; then
            ASG_NAME=$(aws autoscaling describe-auto-scaling-groups \
              --query "AutoScalingGroups[?LaunchTemplate.LaunchTemplateName=='csye6225_asg'].AutoScalingGroupName | [0]" \
              --output text)
          fi
          if [ -z "$ASG_NAME" ] || [ "$ASG_NAME" == "None" ] || [ "$ASG_NAME" == "null" ]; then
            ASG_NAME=$(aws autoscaling describe-auto-scaling-groups \
              --query "AutoScalingGroups[0].AutoScalingGroupName" \
              --output text)
          fi
          if [ -z "$ASG_NAME" ] || [ "$ASG_NAME" == "None" ] || [ "$ASG_NAME" == "null" ]; then
            ASG_NAME="demo-vpc-asg"
          fi

          echo "Using Auto Scaling Group: $ASG_NAME"

          # Ensure ASG uses $Latest launch template version
          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name "$ASG_NAME" \
            --launch-template "LaunchTemplateName=csye6225_asg,Version=\$Latest"

          # Start instance refresh
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 60}' \
            --query 'InstanceRefreshId' \
            --output text)
          echo "Started Instance Refresh ID: $REFRESH_ID"
          echo "REFRESH_ID=$REFRESH_ID" >> $GITHUB_ENV
          echo "ASG_NAME=$ASG_NAME" >> $GITHUB_ENV

      - name: Wait for Instance Refresh to complete
        run: |
          echo "Monitoring Instance Refresh $REFRESH_ID for ASG $ASG_NAME..."
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query "InstanceRefreshes[0].Status" \
              --output text)

            echo "Current status: $STATUS"

            if [ "$STATUS" == "Successful" ]; then
              echo "Instance refresh completed successfully!"
              exit 0
            elif [ "$STATUS" == "Failed" ] || [ "$STATUS" == "Cancelled" ] || [ "$STATUS" == "RollbackFailed" ] || [ "$STATUS" == "RollbackSuccessful" ]; then
              echo "Instance refresh ended with status: $STATUS"
              exit 1
            fi

            sleep 15
          done
