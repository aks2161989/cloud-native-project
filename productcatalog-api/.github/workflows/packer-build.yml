name: Build Packer AMI

on:
  push:
    branches:
      - master

jobs:
  build-ami:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: productcatalog_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d productcatalog_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run integration tests and build artifact
        run: mvn clean verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/productcatalog_db
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3

      - name: Packer init
        run: packer init .

      - name: Validate Packer template
        run: packer validate .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Build AMI
        run: packer build .